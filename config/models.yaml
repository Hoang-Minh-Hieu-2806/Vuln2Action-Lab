# Generation provider configs. The pipeline selects via `default_provider`
# in settings.yaml or --provider flag.
providers:
  rule_based:
    enabled: true
    # no external deps

  llm:
    enabled: false
    # TODO: wire an OpenAI-compatible client.
    api_base_env: LLM_API_BASE
    api_key_env: LLM_API_KEY
    model_env: LLM_MODEL
    default_model: gpt-4o-mini
    timeout_seconds: 60

  # Local T5 generator (P1.1). torch/transformers are OPTIONAL extras:
  #   python -m pip install -e ".[t5]"
  # Nothing is downloaded unless allow_download is true or the checkpoint is
  # already present in the local Hugging Face cache.
  t5:
    enabled: true
    base_checkpoint: t5-small
    # Path to a fine-tuned checkpoint produced by scripts/train_t5.py.
    # Empty = use base_checkpoint (untuned) as a smoke-test fallback.
    checkpoint: ""
    max_input_length: 512
    max_target_length: 512
    max_new_tokens: 256
    num_beams: 4
    device: cpu
    allow_download: false
