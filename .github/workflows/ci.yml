name: CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: |
          python -m ruff check src api scripts tests evaluation
          python -m ruff format --check src api scripts tests evaluation

      - name: Compile modules
        run: python -m compileall -q src/vuln2action api scripts tests evaluation

      - name: Run tests
        run: python -m pytest -q

      - name: Run CLI smoke tests
        run: |
          vuln2action --list-samples
          vuln2action --sample CVE-2024-0001 --json-only > smoke-output.json
          python -c "import json; data=json.load(open('smoke-output.json', encoding='utf-8')); assert data['result']['status'] == 'SIMULATED'"

      - name: Run retrieval evaluation
        run: |
          python scripts/run_evaluation.py --stage retrieval --json-only > retrieval-report.json
          python -c "import json; data=json.load(open('retrieval-report.json', encoding='utf-8')); assert set(data['results']) == {'keyword', 'tfidf', 'semantic'}; assert data['results']['tfidf']['precision'] > 0; assert data['results']['semantic']['precision'] > 0"

      - name: Build distribution
        run: python -m build
