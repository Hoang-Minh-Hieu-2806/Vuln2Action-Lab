[build-system]
requires = ["setuptools>=65.5"]
build-backend = "setuptools.build_meta"

[project]
name = "vuln2action-lab"
version = "0.2.0"
description = "LLM-assisted framework for CVE analysis, reproduction workflow generation, and vulnerability validation in isolated Docker environments."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6.0",
  "pydantic>=2.0",
  "requests>=2.31",
  "python-dotenv>=1.0",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
test = ["pytest>=8.0"]

[project.scripts]
vuln2action = "vuln2action.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["vuln2action*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py311"
